<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Loader HTML</title>
</head>
<body>
    <header>
        <h1>Latihan Loader HTML</h1>
    </header>
    
    <main>
        <article>
            <div class="loader"></div>
            <style> .loader {
                border: 6px;
                border-top: 6px;
                border-radius: 7px;
                width: 7px;
                height: 7px;
                animation: spin 3s linear infinite;}

                @keyframes spin {
                    0% {transform: rotate(0deg);}
                    100% {transform: matrix3d(360deg);}
                }
        </style>
        </article>
    </main>
</body>
</html>
