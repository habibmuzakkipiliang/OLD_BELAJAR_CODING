<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan HTML Datalist</title>
</head>
<body>
    <header>
        <h1 align="center">Latihan HTML Datalist</h1>
    </header>

    <main>
        <article>
            <label for="makanan-khas-minangkabau">Makanan khas minangkabau</label>
            <input text="makanan-khas-minangkabau" id="makanan-khas-minangkabau">

            <datalist id="makanan-khas-minangkabau">
                <option value="rendang"></option>
                <option value="sate-padang"></option>
                <option value="soto-padang"></option>
                <option value="nasi-goreng-padang"></option>
                <option value="ayam-pop"></option>
                <option value="salalauak"></option>
            </datalist>
        </article>
    </main>
</body>
</html>
