<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Dasar HTML</title>
</head>
<!--Style CSS-->

<style>
    b, html, p , li, ol, table {
        font-size: medium;
        kerning: auto;
        background-color: aqua;
        color: black;
    }
</style>
<body>
    <!--Judul html -->

    <h1>Judul 1</h1>
    <h2>Judul 2</h2>
    <h3>Judul 3</h3>
    <h4>Judul 4</h4>

    <!--Paragraf dan format-->

    <p>Hello World</p>

    <br><b>Tebal </b>
    <br><i>Tipis</i>
    <br><u>Garis bawah</u>

    <br><strong>Tebal</strong>
    <br><strike>Miring</strike>
    <br><sup>Tes</sup>
    <br><sub>Tes</sub>

    <!--link-->
    <br><a href="j" style="color: green;">TES INI</a>
    <br><button type="button"><a href="j">LINK INI</a></button>

    <!--Tabel-->

    <table border="1" style="border-collapse: collapse; font-size: larger; padding: 6px;">
        <tr>
            <th>No</th>
            <th>Nama</th>
            <th>Aktif</tg>
        </tr>
        <tr>
            <td>1.</td>
            <td>Hujan</td>
            <td>Aktif</td>
        </tr>
        <tr>
            <td>2.</td>
            <td>Badai</td>
            <td>Aktif</td>
        </tr>
    </table>

    <!--List dan Unlist-->

    <ol>
        <li>header</li>
        <li>border</li>
        <li>enamu</li>
        <li>sengah</li>
        <li>juki</li>
    </ol>

    <ul style="list-style-type: lower-latin;">
        <li>Hujan</li>
        <li>Badai</li>
        <li>Namko</li>
        <li>Ujian</li>
    </ul>

    <!--Gambar, Video dan Audio-->

    <img src="gambar.jpg" alt="Gambar Contoh">
    <video src="video.mp4" width="500px" height="500px"></video>
    <audio src="audio.mp3"></audio>

    <!--Form-->
    <fieldset>
        <form action="" method="post">
            <label for="Nama kamu">Nama Kamu :</label>
            <input type="text" name="" id="">
            <p></p>
            <label for="Nama lengkap">Nama lengkap :</label>
            <input type="text" name="" id="">
            <p></p>
            <label for="Kelas">Kelas :</label>
            <input type="text" name="" id="">
            <p></p>
            <input type="submit" value="Kirim" style="background-color: red;">
            <p></p>
            <input type="reset" value="Hapus" style="background-color: aqua;">
        </form>
    </fieldset>
</body>
</html>
