<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Web Page Image</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        img {
            width: 100%;
            height: auto;
        }
        @media (min-width: 768px) {
            .container {
                display: flex;
                flex-wrap: wrap;
            }
            .container img {
                width: 48%;
                margin: 1%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://media.istockphoto.com/id/692788940/id/foto/pelangi-di-kuil-ulun-danu.jpg?s=1024x1024&w=is&k=20&c=zARzreZEBUdw-tq_8vgiGH6B7CT9iTshjwLzyBa3n_Q=" alt="Sample Image 1">
        <img src="https://media.istockphoto.com/id/692788940/id/foto/pelangi-di-kuil-ulun-danu.jpg?s=1024x1024&w=is&k=20&c=zARzreZEBUdw-tq_8vgiGH6B7CT9iTshjwLzyBa3n_Q=" alt="Sample Image 2">
        <img src="https://media.istockphoto.com/id/692788940/id/foto/pelangi-di-kuil-ulun-danu.jpg?s=1024x1024&w=is&k=20&c=zARzreZEBUdw-tq_8vgiGH6B7CT9iTshjwLzyBa3n_Q=" alt="Sample Image 3">
        <img src="https://media.istockphoto.com/id/692788940/id/foto/pelangi-di-kuil-ulun-danu.jpg?s=1024x1024&w=is&k=20&c=zARzreZEBUdw-tq_8vgiGH6B7CT9iTshjwLzyBa3n_Q=" alt="Sample Image 4">
    </div>
</body>
</html>
