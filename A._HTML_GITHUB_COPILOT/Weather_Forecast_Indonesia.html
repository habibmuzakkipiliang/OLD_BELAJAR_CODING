<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast Indonesia</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f0f0f0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            background: #007BFF;
            color: white;
            padding: 10px 0;
            text-align: center;
        }
        .weather-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin: 20px 0;
            padding: 20px;
            text-align: center;
        }
        .weather-card h2 {
            margin: 0;
        }
        .weather-card p {
            margin: 5px 0;
        }
        .weather-card img {
            width: 100px;
        }
        .footer {
            text-align: center;
            padding: 10px;
            background: #007BFF;
            color: white;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Weather Forecast Indonesia</h1>
    </header>
    <div class="container">
        <div id="weather-container"></div>
    </div>
    <div class="footer">
        <p>&copy; 2023 Weather Forecast Indonesia</p>
    </div>
    <script>
        const apiKey = 'YOUR_API_KEY';
        const regions = ['Jakarta', 'Surabaya', 'Bandung', 'Medan', 'Bali'];

        async function fetchWeather(region) {
            const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${region},ID&appid=${apiKey}&units=metric`);
            const data = await response.json();
            return data;
        }

        function displayWeather(data) {
            const weatherContainer = document.getElementById('weather-container');
            const weatherCard = document.createElement('div');
            weatherCard.className = 'weather-card';
            weatherCard.innerHTML = `
                <h2>${data.name}</h2>
                <img src="http://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png" alt="${data.weather[0].description}">
                <p>Temperature: ${data.main.temp}°C</p>
                <p>Humidity: ${data.main.humidity}%</p>
                <p>Condition: ${data.weather[0].description}</p>
            `;
            weatherContainer.appendChild(weatherCard);
        }

        async function loadWeather() {
            for (const region of regions) {
                const weatherData = await fetchWeather(region);
                displayWeather(weatherData);
            }
        }

        loadWeather();
    </script>
</body>
</html>
