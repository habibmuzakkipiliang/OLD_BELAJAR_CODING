<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Web Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 1em 0;
        }
        .container {
            padding: 20px;
        }
        .box {
            background-color: #f4f4f4;
            padding: 20px;
            margin: 10px 0;
            border-radius: 5px;
        }
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            .box {
                margin: 5px 0;
            }
        }
        @media (max-width: 480px) {
            header {
                font-size: 1.2em;
            }
            .box {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Responsive Web Page</h1>
    </header>
    <div class="container">
        <div class="box">
            <h2>Box 1</h2>
            <p>This is a simple responsive box.</p>
        </div>
        <div class="box">
            <h2>Box 2</h2>
            <p>This is another simple responsive box.</p>
        </div>
    </div>
</body>
</html>
