<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh Halaman Responsif</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 1em 0;
        }
        nav {
            display: flex;
            justify-content: center;
            background-color: #333;
        }
        nav a {
            color: white;
            padding: 14px 20px;
            text-decoration: none;
            text-align: center;
        }
        nav a:hover {
            background-color: #ddd;
            color: black;
        }
        .container {
            padding: 20px;
        }
        .content {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
        }
        .card {
            background-color: #f4f4f4;
            margin: 10px;
            padding: 20px;
            border-radius: 5px;
            flex: 1 1 calc(33.333% - 40px);
            box-sizing: border-box;
        }
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 1em 0;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
        @media (max-width: 768px) {
            .card {
                flex: 1 1 calc(50% - 40px);
            }
        }
        @media (max-width: 480px) {
            .card {
                flex: 1 1 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Contoh Halaman Responsif</h1>
    </header>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>
    <div class="container">
        <div class="content">
            <div class="card">
                <h2>Card 1</h2>
                <p>Ini adalah contoh konten untuk card 1.</p>
            </div>
            <div class="card">
                <h2>Card 2</h2>
                <p>Ini adalah contoh konten untuk card 2.</p>
            </div>
            <div class="card">
                <h2>Card 3</h2>
                <p>Ini adalah contoh konten untuk card 3.</p>
            </div>
        </div>
    </div>
    <footer>
        <p>&copy; 2023 Contoh Halaman Responsif</p>
    </footer>
</body>
</html>
