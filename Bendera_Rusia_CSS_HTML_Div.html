<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bendera Rusia CSS HTML Div</title>
</head>
<style>
    p {font-size: 30px;}
    #red {
        background-color: red;
        height: 100px;
        width: 400px;
        box-shadow: 0 0 0 3px;
    }
    #white {
        background-color: white;
        height: 100px;
        width: 400px;
        box-shadow: 0 0 0 3px;
    }
    #blue {
        background-color: blue;
        height: 100px;
        width: 400px;
        box-shadow: 0 0 0 3px;
    }
</style>
<body>
    <h1 align="center">Bendera Rusia CSS HTML</h1>
    <div id="white"></div>
    <div id="red"></div>
    <div id="blue"></div>
    <p>Bendera Rusia</p>
    <hr sizes="1000">
</body>
</html>
