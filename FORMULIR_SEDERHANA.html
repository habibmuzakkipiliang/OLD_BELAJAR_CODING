<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Sederhana</title>
</head>
<body>
    <header>
        <h1 align="center">Formulir Sederhana</h1>
    </header>

    <main>
        <article>
            <form action="" method="get">
                <fieldset>
                    <label for="Waktu Sekarang">Waktu Sekarang :</label>
                    <input type="datetime-local" required>
                    <hr>
                    <p>
                    </p>
                    <label for="nama lengkap">Nama lengkap : </label><input type="text" required>
                    <p>
                    </p>
                    <label for="Nama panggilan">Nama panggilan : </label><input type="text" required>
                    <p>
                    </p>
                    <label for="Kelas">Kelas : </label><input type="text" required>
                    <p>
                    </p>
                    <label for="Nomor telepon">Nomor telepon : </label><input type="tel" required>
                    <p>
                    </p>
                    <label for="Akun Instagram">Akun Instagram :</label><input type="text" required>
                    <p>
                    </p>
                    <label for="Akun Tiktok">Akun Tiktok : </label><input type="text" required>
                    <p>
                    </p>
                    <label for="Akun Facebook">Akun Facebook : </label><input type="text" name="text" id="text" required>
                    <p>
                    </p>
                    <label for="Akun Twitter">Akun Twitter : </label><input type="text" name="text" id="text" required>
                    <hr>
                    <input type="submit" value="Kirim">
                    <input type="reset" value="Hapus">
                </fieldset>
            </form>
        </article>
    </main>
</body>
</html>
