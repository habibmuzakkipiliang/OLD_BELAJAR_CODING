<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Formulir HTML (MAN 2 Kota Serang)</title>
</head>
<style type="text/css">form,button,select,input,textarea,footer{font-size: 24px;}
    body {background-color: aqua;
color: black;}
</style>
<body>
    <h1 align="center">Cara membuat formulir di HTML MAN 2 Kota Serang</h1>
    <fieldset>
    <form action="formulir.html" method="get">
        <legend>
            <label for="Nama lengkap">Nama lengkap:</label>
            <input type="text" placeholder="masukkan nama lengkap" required>
            <p>
            </p>
            <label for="Nama panggilan">Nama panggilan:</label>
            <input type="text" placeholder="masukkan nama panggilan" required>
            <p>
            </p>
            <label for="Asal Sekolah">Asal Sekolah:</label>
            <input type="text" placeholder="masukkan asal sekolah" required>
            <p>
            </p>
            <label for="Angkatan asal sekolah">Angkatan asal Sekolah:</label>
            <input type="text" placeholder="masukkan angkatan SMP" required>
            <p>
            </p>
            <label for="Tempat Lahir">Tempat Lahir:</label>
            <input type="text" placeholder="masukkan tempat lahir" required>
            <p>
            </p>
            <label for="Tanggal Lahir">Tanggal Lahir:</label>
            <input type="date" placeholder="masukkan tanggal lahir" required>
            <p>
            </p>
            <label for="Kelas">Kelas:</label>
            <select required>
                <option value="-">-</option>
                <option value="X Agama">X Agama</option>
                <option value="X Bahasa">X Bahasa</option>
                <option value="X IPA 1">X IPA 1</option>
                <option value="X IPA 2">X IPA 2</option>
                <option value="X IPA 3">X IPA 3</option>
                <option value="X IPA 4">X IPA 4</option>
                <option value="X IPA 5">X IPA 5</option>
                <option value="X IPS 1">X IPS 1</option>
                <option value="X IPS 2">X IPS 2</option>
                <option value="X IPS 3">X IPS 3</option>
                <option value="XI Agama">XI Agama</option>
                <option value="XI Bahasa">XI Bahasa</option>
                <option value="XI IPA 1">XI IPA 1</option>
                <option value="XI IPA 2">XI IPA 2</option>
                <option value="XI IPA 3">XI IPA 3</option>
                <option value="XI IPA 4">XI IPA 4</option>
                <option value="XI IPA 5">XI IPA 5</option>
                <option value="XI IPS 1">XI IPS 1</option>
                <option value="XI IPS 2">XI IPS 2</option>
                <option value="XI IPS 3">XI IPS 3</option>
                <option value="XII Agama">XII Agama</option>
                <option value="XII Bahasa">XII Bahasa</option>
                <option value="XII IPA 1">XII IPA 1</option>
                <option value="XII IPA 2">XII IPA 2</option>
                <option value="XII IPA 3">XII IPA 3</option>
                <option value="XII IPA 4">XII IPA 4</option>
                <option value="XII IPA 5">XII IPA 5</option>
                <option value="XII IPA 6">XII IPA 6</option>
                <option value="XII IPS 1">XII IPS 1</option>
                <option value="XII IPS 2">XII IPS 2</option>
                <option value="XII IPS 3">XII IPS 3</option>
            </select>
            <p>
            </p>
            <label for="Alamat rumah">Alamat rumah:</label>
            <input type="text" placeholder="Masukkan Alamat Rumah" required>
            <p>
            </p>
            <label for="Alamat Email">Alamat email:</label>
            <input type="email" placeholder="masukkan alamat email" required>
            <p>
            </p>
            <label for="Password Email">Password Email:</label>
            <input type="password" placeholder="masukkan password email" required>
            <p>
            </p>
            <label for="Nomor HP">Nomor HP:</label>
            <input type="number" placeholder="masukkan nomor hp" required>
            <p>
            </p>
            <label for="Jenjang Pramuka">Jenjang Pramuka</label>
            <input type="text" placeholder="Masukkan Jenjang Pramuka" required>
            <p>
            </p>
            <label for="Jenjang TKU"> Jenjang TKU:</label>
            <input type="text" placeholder="Masukkan Jenjang TKU" required>
            <p>
            </p>
            <label for="Pilihan">Pilihan:</label>
            <input type="submit" value="Kirim" required>
            <input type="reset" value="Hapus" required>
        </legend>
    </form>
</fieldset>
<footer align="center">
    &copy; 2023 Habib Muzakki. Hak Cipta dilindungi
</footer>
</body>
</html>
