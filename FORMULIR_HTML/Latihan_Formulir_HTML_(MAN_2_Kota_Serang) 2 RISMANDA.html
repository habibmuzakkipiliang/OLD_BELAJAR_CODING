<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Formulir HTML (MAN 2 Kota Serang)</title>
</head>
<style>
    p,li,ol,li,label,input {font-size: large;}
</style>
<body>
    <header>
        <h1 align="center">Latihan Formulir HTML (MAN 2 Kota Serang) 2024, Zaman Kurikulum Merdeka</h1>
    </header>

    <main>
        <article>
            <fieldset>
                <form action="formulir.html" method="get"></form>
                <label for="Nama lengkap">Nama lengkap :</label>
                <input type="text" placeholder="Masukan nama lengkap" required>
                <p>
                </p>
                <label for="Nama panggilan">Nama panggilan :</label>
                <input type="text" placeholder="masukan nama panggilan" required>
                <p>
                </p>
                <label for="Asal sekolah">Asal sekolah :</label>
                <input type="text" placeholder="masukan asal sekolah" required>
                <p>
                </p>
                <label for="Tempat lahir">Tempat lahir :</label>
                <input type="text" placeholder="masukan tempat lahir" required>
                <p>
                </p>
                <label for="Tanggal lahir">Tanggal lahir :</label>
                <input type="date" placeholder="masukan Tanggal lahir" required>
                <p>
                </p>
                <label for="Kelas">Kelas :</label>
                <select name="Kelas" id="Kelas">
                    <option value="-">-</option>
                    <option value="X-1">X-1</option>
                    <option value="X-2">X-2</option>
                    <option value="X-3">X-3</option>
                    <option value="X-4">X-4</option>
                    <option value="X-5">X-5</option>
                    <option value="X-6">X-6</option>
                    <option value="X-7">X-7</option>
                    <option value="X-8">X-8</option>
                    <option value="X-9">X-9</option>
                    <option value="X-10">X-10</option>
                    <option value="XI IPA 1">XI IPA 1</option>
                    <option value="XI IPA 2">XI IPA 2</option>
                    <option value="XI IPA 3">XI IPA 3</option>
                    <option value="XI IPA 4">XI IPA 4</option>
                    <option value="XI IPA 5">XI IPA 5</option>
                    <option value="XI IPS 1">XI IPS 1</option>
                    <option value="XI IPS 2">XI IPS 2</option>
                    <option value="XI IPS 3">XI IPS 3</option>
                    <option value="XI BAHASA">XI BAHASA</option>
                    <option value="XI AGAMA">XI AGAMA</option>
                </select>
                <p>
                </p>
                <label for="Ingin masuk Organisasi apa ">Ingin masuk Organisasi apa :</label>
                <input type="text" placeholder="boleh lebih dari 1" required>
                <p>
                </p>
                <label for="Alasan masuk Organisasi">Alasan masuk organisasi :</label>
                <input type="text" placeholder="Masukan alasan kamu" required>
                <p>
                </p>
                <label for="Suku / Etnis">Suku / Etnis :</label>
                <input type="text" placeholder="masukan etnis disini" required>
                <p>
                </p>
                <p><b>Media Sosial Kamu</b></p>
                <label for="Nomor hp">Nomor hp :</label>
                <input type="number" name="Nomor" id="Nomor" placeholder="Wajib diisi" required>
                <p>
                </p>
                <label for="Nama pengguna IG :">Nama pengguna IG :</label>
                <input type="text" placeholder="Wajib diisi" required>
                <p>
                </p>
                <label for="Nama Pengguna Tiktok">Nama Pengguna Tiktok :</label>
                <input type="text" placeholder="Wajib diisi" required>
                <hr>
                <button type="button"><input type="submit" value="Kirim"></button>
                <button type="button"><input type="reset" value="Hapus"></button>
            </fieldset>
        </article>
    </main>
</body>
</html>
