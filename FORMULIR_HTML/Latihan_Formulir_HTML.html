<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Formulir HTML</title>
</head>
<style type="text/css">form,button,select,input,textarea,footer{font-size: 24px;}
    body {background-color: aqua;
color: black;}
</style>
<body>
    <h1 align="center">Cara membuat formulir di HTML</h1>
        <form action="Formulir.html" method="get">
            <fieldset>
            <label for="Nama Lengkap">Nama lengkap:</label>
            <input type="text" placeholder="masukkan nama lengkap" required>
            <p>
            </p>
            <label for="Nama Panggilan">Nama panggilan:</label>
            <input type="text" placeholder="masukkan nama panggilan" required>
            <p>
            </p>
            <label for="Tempat Lahir">Tempat lahir:</label>
            <input type="text" placeholder="masukkan tempat lahir" required>
            <p>
            </p>
            <label for="Tanggal Lahir">Tanggal lahir:</label>
            <input type="date" placeholder="masukkan tanggal lahir" required>
            <p>
            </p>
            <label for="Jenis Kelamin">Jenis kelamin:</label>
            <select required>
                <option value="-">-</option>
                <option value="Laki-laki">Laki-laki</option>
                <option value="Perempuan">Perempuan</option>
            </select>
            <p>
            </p>
            <label for="Agama">Agama:</label>
            <select required>
                <option value="-">-</option>
                <option value="Islam">Islam</option>
                <option value="Kristen Protestan">Kristen Prostestan</option>
                <option value="Katolik">Katolik</option>
                <option value="Hindu">Hindu</option>
                <option value="Buddha">Buddha</option>
                <option value="Konghucu">Konghucu</option>
            </select>
            <p>
            </p>
            <label for="Jenjang">Jenjang:</label>
            <select required>
                <option value="-">-</option>
                <option value="TK">TK</option>
                <option value="SD">SD</option>
                <option value="SMP">SMP</option>
                <option value="SMA">SMA</option>
                <option value="D3">D3</option>
                <option value="D4">D4</option>
                <option value="S1">S1</option>
                <option value="s2">S2</option>
                <option value="S3">S3</option>
            </select>
            <p>
            </p>
            <label for="Kelas">Kelas</label>
            <select required>
                <option value="-">-</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12">12</option>
            </select>
            <p>
            </p>
            <label for="Nama Sekolah">Nama sekolah:</label>
            <input type="text" placeholder="masukkan nama Sekolah" required>
            <p>
            </p>
            <label for="Nama Universitas">Nama Universitas:</label>
            <input type="text" placeholder="masukkan Universitas" required>
            <p>
            </p>
            <label for="Jurusan">Jurusan:</label>
            <select required>
                <option value="-">-</option>
                <option value="IPA">IPA</option>
                <option value="Agama">Agama</option>
                <option value="Bahasa">Bahasa</option>
                <option value="Matematika">Matematika</option>
                <option value="Ekonomi">Ekonomi</option>
                <option value="Ekonomi Syariah">Ekonomi Syariah</option>
                <option value="Farmasi">Farmasi</option>
                <option value="Teknik">Teknik Bangunan</option>
                <option value="Teknik Mesin">Teknik Mesin</option>
                <option value="Teknik Sipil">Teknik Sipil</option>
                <option value="Teknik Geologi">Teknik Geologi</option>
                <option value="Teknik Perkapalan">Teknik Perkapalan</option>
                <option value="Tata Boga">Tata Boga</option>
                <option value="Informatika">Informatika</option>
                <option value="Arsitektur">Arsitektur</option>
                <option value="Teknik Komputer">Teknik Komputer</option>
                <option value="Ilmu Informasi">Ilmu Informasi</option>
                <option value="Biologi">Biologi</option>
                <option value="Fisika">Fisika</option>
                <option value="Robotik">Robotik</option>
                <option value="Hukum">Hukum</option>
                <option value="Sosiologi">Sosiologi</option>
                <option value="Politik">Politik</option>
                <option value="Peternakan">Peternakan</option>
                <option value="Kedokteran">Kedokteran</option>
            </select>
            <p>
            </p>
            <label for="Warga Negara">Warga negara:</label>
            <input type="text" placeholder="masukkan warga negara" required>
            <p>
            </p>
            <label for="Nomor hp">Nomor hp:</label>
            <input type="number" placeholder="masukkan nomor hp" required>
            <p>
            </p>
            <label for="">Email:</label>
            <input type="email" placeholder="masukkan email" required>
            <p>
            </p>
            <label for="Jenjang Pramuka">Jenjang Pramuka:</label>
            <input type="text" placeholder="Masukkan Jenjang Pramuka" required>
            <p>
            </p>
            <label for="Tingkatan TKU">Tingkatan TKU:</label>
            <input type="text" placeholder="masukkan Jenjang TKU" required>
            <p>
            </p>
            <label for="Hobi">Hobi:</label>
            <input type="text" placeholder="masukkan hobi" required>
            <p>
            </p>
            <label for="Biografi">Biografi:</label>
            <textarea placeholder="masukkan biografi disini" rows="15px" cols="30px" required></textarea>
            <p>
            </p>
            <label for="Foto">Foto:</label>
            <input type="file" value="masukkan foto disini" required>
            <p>
            </p>
            <nav>
                <label for="Pilihan">Pilihan:</label>
                <input type="reset" value="Hapus" required>
                <input type="submit" value="Kirim" required>
            </nav>
        </form>
    </fieldset>
    <footer align="center">
        &copy; 2023 Habib Muzakki. Hak Cipta dilindungi
    </footer>
</body>
</html>
