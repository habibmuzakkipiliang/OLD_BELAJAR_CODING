<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh Formulir OSIS HTML</title>
</head>
<style type="text/css">form,button,select,input,textarea,footer{font-size: 24px;}
    body {background-color: aqua;
color: black;}
</style>
<body>
    <h1 align="center">Formulir OSIS HTML</h1>
    <form action="formulir.html">
        <fieldset>
            <label for="Nama lengkap">Nama lengkap:</label>
            <input type="text" placeholder="Masukkan nama lengkap" required>
            <p>
            </p>
            <label for="Nama panggilan">Nama panggilan:</label>
            <input type="text" placeholder="Masukkan nama panggilan" required>
            <p>
            </p>
            <label for="Kelas">Kelas:</label>
            <input type="text" placeholder="Masukkan kelas" required>
            <p>
            </p>
            <label for="Nomor hp">Nomor hp:</label>
            <input type="text" placeholder="Masukkan nomor hp" required>
            <p>
            </p>
            <label for="IG">IG:</label>
            <input type="text" placeholder="Masukkan akun IG" required>
            <p>
            </p>
            <label for="Tiktok">Tiktok:</label>
            <input type="text" placeholder="Masukkan akun Tiktok" required>
            <p>
            </p>
            <label for="Alamat email">Alamat email:</label>
            <input type="email" placeholder="Masukkan alamat email" required>
            <p>
            </p>
            <label for="Password email">Password email:</label>
            <input type="password" placeholder="Masukkan password email" required>
            <p>
            </p>
            <label for="Visi">Visi:</label>
            <input type="text" placeholder="Masukkan visi" required>
            <p>
            </p>
            <label for="Misi">Misi:</label>
            <input type="text" placeholder="Masukkan misi" required>
            <p>
            </p>
            <label for="Alasan masuk organisasi OSIS">Alasan masuk organisasi OSIS:</label>
            <input type="text" placeholder="masukkan alasan" required>
            <p>
            </p>
            <nav>
                <label for="Pilihan">Pilihan:</label>
                <input type="submit" value="Kirim" required>
                <input type="reset" value="Hapus" required>
            </nav>
        </fieldset>
    </form>
    <footer align="center">
        &copy; 2023 Habib Muzakki. Hak Cipta dilindungi
    </footer>
</body>
</html>
