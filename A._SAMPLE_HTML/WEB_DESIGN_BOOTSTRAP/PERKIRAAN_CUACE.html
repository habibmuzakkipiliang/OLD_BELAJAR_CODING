<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perkiraan Cuaca</title>
    <style>
        /* CSS untuk tata letak dan desain */
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .weather-container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 300px;
        }
        .weather-container h1 {
            margin: 0;
            font-size: 24px;
        }
        .weather-container p {
            margin: 5px 0;
        }
        .weather-container img {
            width: 100px;
            height: 100px;
        }
        .location-input {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="weather-container">
        <h1>Perkiraan Cuaca</h1>
        <div class="location-input">
            <input type="text" id="locationInput" placeholder="Masukkan lokasi" />
            <button onclick="getWeather()">Cari</button>
        </div>
        <p id="location">Lokasi: -</p>
        <p id="temperature">Suhu: -</p>
        <p id="description">Deskripsi: -</p>
        <img id="weatherIcon" src="" alt="Ikon Cuaca" style="display: none;">
    </div>

    <script>
        const apiKey = 'YOUR_API_KEY'; // Ganti dengan API key Anda

        function getWeather() {
            const location = document.getElementById('locationInput').value;
            const apiUrl = `https://api.openweathermap.org/data/2.5/weather?q=${location}&units=metric&appid=${apiKey}`;

            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('location').textContent = `Lokasi: ${data.name}`;
                    document.getElementById('temperature').textContent = `Suhu: ${data.main.temp}°C`;
                    document.getElementById('description').textContent = `Deskripsi: ${data.weather[0].description}`;
                    const iconUrl = `http://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png`;
                    document.getElementById('weatherIcon').src = iconUrl;
                    document.getElementById('weatherIcon').style.display = 'block';
                })
                .catch(error => console.error('Error:', error));
        }
    </script>
</body>
</html>
