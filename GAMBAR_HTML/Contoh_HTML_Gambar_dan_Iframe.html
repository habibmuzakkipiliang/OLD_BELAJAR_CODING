<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh HTML dengan Gambar dan Iframe</title>
</head>
<body>
    <h1>Gambar</h1>
    <p>Ini adalah contoh gambar:</p>
    <img src="nama-gambar.jpg" alt="Deskripsi gambar" width="300" height="200">

    <h1>Iframe</h1>
    <p>Ini adalah contoh iframe yang menampilkan halaman web lain:</p>
    <iframe src="https://www.contoh.com" width="800" height="600" frameborder="0" scrolling="auto"></iframe>
</body>
</html>
