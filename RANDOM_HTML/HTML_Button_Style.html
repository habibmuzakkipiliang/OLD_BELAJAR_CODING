<html lang="en">
<head>

    <title>HTML Button Style</title>
</head>
<style>
    button {
        font-size: medium;
        background: fixed;
        background-color: aqua;
        font-weight: bold;
        border-radius: 0%;
        padding: 5px;
        text-transform: uppercase;
    }
</style>
<body>
    <header>
        <h1 align="center">HTML Button Style</h1>
    </header>

    <main>
        <article>
            <button>KLIK DISINI</button>
        </article>
    </main>
</body>
</html>
