<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML FORM ELEMEN</title>
</head>
<body>
    <header>
        <h1 align="center">HTML FORM ELEMEN</h1>
    </header>

    <main>
        <article>
            <label for="untuk">Isi dengan kalimat yang benar</label>
            <input type="text" autocapitalize="sentence">
            <hr>
            <label for="untuk">Isi dengan kalimat yang benar</label>
            <input type="text" autocapitalize="words">
            <hr>
            <label for="untuk">Isi dengan kalimat yang benar</label>
            <input type="text" autocapitalize="characters">
            <hr>
            <label for="untuk">Isi dengan kalimat yang benar</label>
            <input type="text" autocapitalize="off">
        </article>
    </main>
</body>
</html>
